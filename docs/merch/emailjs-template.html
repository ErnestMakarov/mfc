<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая заявка на мерч MFC</title>
</head>
<body style="margin:0;padding:24px 12px;background:#f4f7fd;color:#14243d;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:620px;margin:0 auto;background:#ffffff;border:1px solid #e1e8f2;border-radius:12px;">
    <tr>
      <td style="padding:26px 30px;background:#14243d;color:#ffffff;border-radius:12px 12px 0 0;">
        <div style="font-size:11px;letter-spacing:2px;color:#a7c3ff;">MAARDU FINSWIMMING CLUB</div>
        <h1 style="font-size:24px;line-height:1.3;margin:12px 0 0;">Новая заявка на мерч</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 30px;">
        <h2 style="margin:0 0 14px;font-size:18px;">Состав заказа</h2>

        <div style="font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;">{{order_items}}</div>

        <h2 style="margin:28px 0 12px;font-size:18px;">Контактные данные</h2>

        <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="font-size:14px;line-height:1.7;border-collapse:collapse;">
          <tr>
            <td style="padding:9px 0;border-bottom:1px solid #edf1f7;color:#778399;">Имя</td>
            <td style="padding:9px 0;border-bottom:1px solid #edf1f7;">{{first_name}}</td>
          </tr>
          <tr>
            <td style="padding:9px 0;border-bottom:1px solid #edf1f7;color:#778399;">Фамилия</td>
            <td style="padding:9px 0;border-bottom:1px solid #edf1f7;">{{last_name}}</td>
          </tr>
          <tr>
            <td style="padding:9px 0;border-bottom:1px solid #edf1f7;color:#778399;">Email</td>
            <td style="padding:9px 0;border-bottom:1px solid #edf1f7;">{{email}}</td>
          </tr>
          <tr>
            <td style="padding:9px 0;color:#778399;">Телефон</td>
            <td style="padding:9px 0;">{{phone}}</td>
          </tr>
        </table>

        <p style="margin:24px 0 0;font-size:12px;line-height:1.7;color:#778399;">
          Это заявка на заказ мерча. Детали заказа согласуются с клиентом отдельно.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
